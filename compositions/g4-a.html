<template id="g4-a-template">
  <style> #root { position: absolute; inset: 0; overflow: hidden; pointer-events: none; } </style>
  <div data-hf-id="hf-x0l4" id="root" data-composition-id="g4-a" data-width="1920" data-height="1080" data-duration="39"></div>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script src="assets/kit.js"></script>
  <script>
    (function () {
      var tl = gsap.timeline({ paused: true });
      var root = document.querySelector('[data-composition-id="g4-a"]');
      var k = K.make(root, tl);
      var BEAT = window.__g4aBeats = {};

      // ---------- Example 2: class Customer (typed from scratch) ----------
      var cw = k.win({ x: 64, y: 150, w: 900, h: 400, title: "Main.py", dash: true, font: 30, lh: 43 });
      var L = cw.block(["class Customer:", "",
        "    def __init__(self,name,address,phone_no):",
        "        self.name = name",
        "        self.address = address",
        "        self.phone_no = phone_no", "",
        "    def place_order(self,dish):",
        "        cost = 0",
        "        delivery_charge = 50",
        "        if dish == 'pizza':",
        "            cost = 500 + delivery_charge",
        "        else:",
        "            cost = 250 + delivery_charge",
        "        return cost"], 0);
      // L: 0 class, 1 def __init__, 2-4 assignments, 5 def place_order, 6 cost = 0,
      //    7 delivery_charge, 8 if, 9 cost = 500, 10 else, 11 cost = 250, 12 return

      // the two dishes and their prices (S23): glossy chips on the right, level with the if/else
      var pizza = k.chip({ x: 1130, y: 520, w: 300, main: "pizza", sub: "500", color: "orange" });
      var burger = k.chip({ x: 1500, y: 520, w: 300, main: "burger", sub: "250", color: "amber" });
      function flipIn(e, at) {
        e.style.transformOrigin = "50% 50%";
        return k.move(e, { autoAlpha: 0, rotationY: -90, z: -220, transformPerspective: 900 },
          { autoAlpha: 1, rotationY: 0, z: 0 }, at, 0.75, "power3.out");
      }

      // ================= S21  new example: class Customer + __init__ =================
      var t = 0.5;
      BEAT.s21 = t;
      t = cw.pop(t);
      t = cw.typeCode(L.slice(0, 5), t + 0.3);
      t += 1.2;

      // ================= S22  place_order(self,dish): cost, delivery_charge =================
      BEAT.s22 = t;
      t = cw.typeCode(L.slice(5, 8), t);
      t += 1.2;

      // ================= S23  pizza 500 / burger 250, the if-branch =================
      BEAT.s23 = t;
      flipIn(pizza, t);
      t = flipIn(burger, t + 0.6);
      t += 1.2;
      BEAT.s23if = t;
      t = cw.typeCode([L[8]], t) + 0.8;
      t = cw.typeCode([L[9]], t);
      t += 1.2;

      // ================= S24  else branch and return cost =================
      BEAT.s24 = t;
      t = cw.typeCode([L[10]], t) + 0.8;
      t = cw.typeCode([L[11]], t) + 0.8;
      t = cw.typeCode([L[12]], t);
      t += 1.6;

      // end: everything fades out
      BEAT.out = t;
      t = k.out([cw.el, pizza, burger], t, 0.6);
      window.__g4aEnd = t;
      window.__timelines["g4-a"] = tl;
    })();
  </script>
</template>
