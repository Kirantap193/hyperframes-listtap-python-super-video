  </style>
  <div data-hf-id="hf-tjqp" id="root" data-composition-id="g7-a" data-width="1920" data-height="1080" data-duration="26.4"></div>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script src="assets/kit.js"></script>
  <script>
    (function () {
      var tl = gsap.timeline({ paused: true });
      var root = document.querySelector('[data-composition-id="g7-a"]');
      var k = K.make(root, tl);
      var IR = { immediateRender: false };
      var BEAT = window.__g7aBeats = {};
      function at(e, from, to, t, dur, ease) { tl.fromTo(e, from, Object.assign({ duration: dur, ease: ease || "power3.out" }, to, IR), t); return t + dur; }

      // ================= code window at the memory size (Example 2, full code) =================
      var cw = k.win({ x: 36, y: 150, w: 600, h: 400, title: "Main.py", dash: true, font: 16, lh: 24 });
      var C = cw.block(["class Customer:", "",
        "    def __init__(self,name,address,phone_no):", "        self.name = name", "        self.address = address", "        self.phone_no = phone_no", "",
        "    def place_order(self,dish):", "        cost = 0", "        delivery_charge = 50", "        if dish == 'pizza':",
        "            cost = 500 + delivery_charge", "        else:", "            cost = 250 + delivery_charge", "        return cost", "",
        "class PlatinumCustomer(Customer):", "",
        "    def __init__(self,name,address,phone_no,platinum_id):", "        super().__init__(name,address,phone_no)", "        self.platinum_id = platinum_id", "",
        "    def place_order(self,dish):", "        delivery_charge = 50", "        return", "    (super().place_order(dish) - delivery_charge)*0.95", "", "",
        "def main():", "    platinum_customer = PlatinumCustomer(", "        'Rohit', 'ITC', 9900887766, 12)", "    print(platinum_customer.place_order('pizza'))", "",
        "if __name__ == '__main__':", "    main()"], 0);
      // g6's window hugs the unsplit return line it showed earlier (the kit fixes a window's width
      // to the longest line it ever holds): the same never-shown line keeps g7's width identical
      cw.add("        return (super().place_order(dish) - delivery_charge)*0.95", 0);

      // ================= Stack / Private Heap + object 1000: g6's final state, built exactly as g6 builds it =================
      var TOP = k.layer({ x: 0, y: 0, w: 1920, h: 1080 });   // arrows: re-appended on top of the panels below
      var M = k.layer({ x: 0, y: 0, w: 1920, h: 1080 });
      var stack = k.el("div", "g7-pn g7-stk", null, null, M.el);
      var heap = k.el("div", "g7-pn g7-hp", null, null, M.el);
      var lbS = k.el("div", "g7-pl", "left:1010px;width:440px;", "Stack", M.el);
      var lbH = k.el("div", "g7-pl", "left:1478px;width:408px;", "Private Heap", M.el);
      [stack, heap].forEach(function (e) { e.setAttribute("data-layout-allow-overflow", "true"); });
      // main(): platinum_customer -> 1000
      var fMain = k.el("div", "g7-fr", "top:810px;height:110px;", '<svg width="400" height="110"><rect x="1.25" y="1.25" width="397.5" height="107.5" rx="20" ' +

      var mBox = k.el("div", "g7-mbx", "left:230px;top:35px;width:130px;height:40px;", null, fMain);
      var mVal = k.el("div", "g7-m g7-mv", "left:230px;top:35px;width:130px;line-height:40px;", "1000", fMain);
      // the PlatinumCustomer object at 1000
      var card = k.el("div", "g7-card", null, null, M.el);
      var addr = k.el("div", "g7-m g7-addr", null, "1000", card), tag = k.el("div", "g7-m g7-tag", null, "PlatinumCustomer", card);
      var typed = [lbS, lbH, fMainNm, mLab, addr];
      [["name", "'Rohit'"], ["address", "'ITC'"], ["phone_no", "9900887766"], ["platinum_id", "12"]].forEach(function (kv, i) {
        var y = 53 + i * 34;
        typed.push(k.el("div", "g7-m g7-hk", "left:18px;top:" + y + "px;", kv[0], card));
        k.el("div", "g7-m g7-hv", "left:155px;top:" + y + "px;", "=", card);
        var v = k.el("div", "g7-m g7-hv", "left:178px;top:" + y + "px;width:" + (kv[1].length * 11.4) + "px;", K.esc(kv[1]), card);
        v.setAttribute("data-layout-allow-overlap", "true");
      });
      mVal.setAttribute("data-layout-allow-overlap", "true");
      typed.forEach(function (e) { k.splitChars(e); });           // g6 typed these letter by letter
      [stack, heap, card].forEach(function (e) {                  // g6 flipped these in (3-D, settled)
        gsap.set(e, { transformOrigin: "50% 50%", rotationY: 0, z: 0, transformPerspective: 900 });
      });
      gsap.set(fMain, { y: 0 });
      gsap.set([mBox, mVal], { transformOrigin: "50% 50%", x: 0, y: 0, scale: 1 });
      var ADDR = { x: 1512 + 14 + 29, y: 222, f: 24 };   // centre of the card's "1000"

      // a stack frame (dashed), its name outside the Stack (right-aligned to x 996)
      function frame(top, h, name) {
        var g = k.hide(k.el("div", "g7-fr", "top:" + top + "px;height:" + h + "px;"));
        g.setAttribute("data-layout-allow-overflow", "true");
        g.innerHTML = '<svg width="400" height="' + h + '"><rect x="1.25" y="1.25" width="397.5" height="' + (h - 2.5) +
          '" rx="20" fill="rgba(255,255,255,0.03)" stroke="#c8d6ff" stroke-opacity="0.45" stroke-width="2.5" stroke-dasharray="7 6"/></svg>';
        k.el("div", "g7-nm", "top:" + (h / 2 - 12) + "px;", name, g);
        g.top = top; return g;
      }
      // a labelled value box inside frame g: label right-aligned before the box (relative coords)
      function slot(g, label, lw, bx, bw, y, pink, h) {
        h = h || 38;
        var s = { g: g, w: bw, cx: 1030 + bx + bw / 2, cy: g.top + y + h / 2 }, hc = "height:" + h + "px;line-height:" + h + "px;";
        if (label) s.lab = k.hide(k.el("div", "g7-lb" + (pink ? " g7-pk" : ""), "left:" + (bx - 12 - lw) + "px;width:" + lw + "px;top:" + y + "px;" + hc, label, g));
        s.box = k.hide(k.el("div", "g7-bx", "left:" + bx + "px;width:" + bw + "px;top:" + y + "px;" + hc, null, g));
        s.box.setAttribute("data-layout-allow-overflow", "true");
        return s;
      }
      function val(s, text) { var v = k.hide(k.el("div", "g7-vl", null, K.esc(text), s.box)); v.setAttribute("data-layout-allow-overlap", "true"); s.box.setAttribute("data-layout-allow-overlap", "true"); return v; }
      function opText(g, x, w, y, text) { return k.hide(k.el("div", "g7-lb g7-op", "left:" + x + "px;width:" + w + "px;top:" + y + "px;", K.esc(text), g)).setAttribute("data-layout-allow-overlap", "true") || g.lastChild; }

      function boxIn(s, t) {
        if (s.lab) k.fade(s.lab, t, 0.3);
        at(s.box, { autoAlpha: 0, scale: 0.55, transformPerspective: 600, rotationX: -60 }, { autoAlpha: 1, scale: 1, rotationX: 0 }, t + 0.15, 0.45);
        return t + 0.6;
      }
      function typeVal(v, t) { return k.typeText(v, t, 0.07); }
      // a copy of a value glides from (sx, sy) into its box (the source stays)
      function fly(v, s, src, t, dur) {
        var sc = (src.f || 19) / 19;
        tl.fromTo(v, { autoAlpha: 0 }, Object.assign({ autoAlpha: 1, duration: 0.15, ease: "power1.out" }, IR), t);
        return at(v, { x: src.x - s.cx, y: src.y - s.cy, scale: sc }, { x: 0, y: 0, scale: 1 }, t, dur || 0.75, "power2.inOut");
      }
      function push(g, t) {
        tl.fromTo(g, { autoAlpha: 0 }, Object.assign({ autoAlpha: 1, duration: 0.3, ease: "power1.out" }, IR), t);
        return at(g, { y: -360 }, { y: 0 }, t, 0.8, "power3.out");
      }
      function popFrame(g, t) { return at(g, { y: 0, autoAlpha: 1 }, { y: -70, autoAlpha: 0 }, t, 0.6, "power2.in"); }

      // main()'s reference to 1000 (already drawn at t = 0, as g6 left it)
      var arMain = TOP.arrow({ d: "M1394 865 C 1472 865, 1472 300, 1508 300" });

      // child place_order(): dish, self / delivery_charge / the expression row
      var fChild = frame(612, 186, "place_order()");
      var cDish = slot(fChild, "dish", 52, 76, 100, 20), cSelf = slot(fChild, "self", 52, 256, 110, 20, true);
      var cDel = slot(fChild, "delivery_charge", 180, 204, 70, 74);
      var vcDish = val(cDish, "'pizza'"), vcSelf = val(cSelf, "1000"), vcDel = val(cDel, "50");
      var arChild = TOP.arrow({ d: "M1398 651 C 1461 651, 1461 268, 1508 268" });

      // parent place_order(): dish, self / cost / delivery_charge
      var fPar = frame(414, 186, "place_order()");
      var pDish = slot(fPar, "dish", 52, 76, 100, 20), pSelf = slot(fPar, "self", 52, 256, 110, 20, true);
      var pCost = slot(fPar, "cost", 52, 76, 80, 74), pDel = slot(fPar, "delivery_charge", 180, 204, 70, 128);
      var vpDish = val(pDish, "'pizza'"), vpSelf = val(pSelf, "1000"), vpCost0 = val(pCost, "0"), vpCost = val(pCost, "550"), vpDel = val(pDel, "50");
      var arPar = TOP.arrow({ d: "M1398 453 C 1450 453, 1450 236, 1508 236" });

      root.appendChild(TOP.el);

      // ================= start: g6's last frame, already on screen at t = 0 (no entrance) =================
      function show0(e) { e.style.opacity = ""; e.style.visibility = ""; }
      show0(cw.el);
      C.forEach(function (L) { L.showAt = -1e9; L.chars.forEach(show0); });
      arMain.mask.setAttribute("stroke-dashoffset", "0");
      gsap.set(arMain.head, { opacity: 1, scale: 1, transformOrigin: "50% 50%" });
      var t = 0.5;

      // ================= S35  platinum_customer.place_order('pizza'): the child's frame =================
      BEAT.s35 = t;
      t = push(fChild, t) + 0.6;
      boxIn(cSelf, t);
      t = fly(vcSelf, cSelf, ADDR, t + 0.5);
      t = TOP.draw(arChild, t, 0.7) + 0.6;
      BEAT.dish = t;
      boxIn(cDish, t);
      t = typeVal(vcDish, t + 0.6) + 0.9;
      BEAT.del = t;
      boxIn(cDel, t);
      t = typeVal(vcDel, t + 0.6) + 1.0;

      // ================= S36  super().place_order(dish): the parent's frame =================
      BEAT.s36 = t;
      t = push(fPar, t) + 0.6;
      boxIn(pSelf, t);
      t = fly(vpSelf, pSelf, ADDR, t + 0.5);
      t = TOP.draw(arPar, t, 0.7) + 0.6;
      BEAT.pdish = t;
      boxIn(pDish, t);
      t = fly(vpDish, pDish, { x: cDish.cx, y: cDish.cy }, t + 0.5) + 0.9;
      BEAT.cost = t;
      boxIn(pCost, t);
      t = typeVal(vpCost0, t + 0.6) + 0.6;
      boxIn(pDel, t);
      t = typeVal(vpDel, t + 0.6) + 1.2;
      // dish == 'pizza': cost = 500 + delivery_charge -> 550
      BEAT.c550 = t;
      at(vpCost0, { y: 0, autoAlpha: 1 }, { y: -16, autoAlpha: 0 }, t, 0.3, "power2.in");
      t = typeVal(vpCost, t + 0.35) + 1.2;
      // return cost: 550 goes back to the child (storyboard S36: the parent frame is then removed)
      BEAT.ret550 = t;
      TOP.undraw(arPar, t, 0.4);
      t = popFrame(fPar, t + 0.1) + 1.0;

      // ================= S37  back in the child: (550 - 50)*0.95 is returned, its frame is removed =================
      BEAT.s37 = t;
      t += 2.4;                                    // the trainer explains 550 - 50 = 500, 95% of 500 = 475.0
      BEAT.pop = t;
      TOP.undraw(arChild, t, 0.4);
      t = popFrame(fChild, t) + 1.4;               // back in main(): only platinum_customer -> 1000 is left

      // ================= end: everything fades out =================
      BEAT.end = t;
      t = k.out([cw.el, M.el, arMain.g], t, 0.6);
      window.__g7aEnd = t;
      window.__timelines["g7-a"] = tl;
    })();
