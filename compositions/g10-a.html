<template id="g10-a-template">
  <style> #root { position: absolute; inset: 0; overflow: hidden; pointer-events: none; } </style>
  <div data-hf-id="hf-efcy" id="root" data-composition-id="g10-a" data-width="1920" data-height="1080" data-duration="41.93"></div>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script src="assets/kit.js"></script>
  <script>
    (function () {
      var tl = gsap.timeline({ paused: true });
      var root = document.querySelector('[data-composition-id="g10-a"]');
      var k = K.make(root, tl);
      var BEAT = window.__g10aBeats = {};

      // ---------- Example 4: multiple inheritance C(A,B), typed from scratch ----------
      var cw = k.win({ x: 64, y: 150, w: 900, h: 400, title: "Main.py", dash: true, font: 30, lh: 43 });
      var L = cw.block(["class A:", "    def fun(self):", "        print('A')", "",
        "class B:", "    def fun(self):", "        print('B')", "",
        "class C(A,B):", "    def test(self):", "        super().fun()", "", "",
        "c_object = C()", "help(c_object)"], 0);
      // L: 0-2 class A, 3-5 class B, 6 class C, 7 def test, 8 super().fun(), 9 c_object = C(), 10 help
      // rows: A 0-2, B 3.5-5.5, C 7-9, c_object 11, help 12

      // the help() listing takes the whole right side (dashed frames >= 50 px apart), font 26 / 36
      var ow = k.win({ x: 590, y: 150, w: 1220, h: 200, title: "output", out: true, font: 26, lh: 36 });

      // ================= S55  two independent classes A and B =================
      var t = 0.5;
      BEAT.s55 = t;
      t = cw.pop(t);
      t = cw.typeCode(L.slice(0, 3), t + 0.3);
      t += 0.8;
      t = cw.typeCode([L[3]], t);          // class B:  (no parent - B does not inherit from A)
      t += 0.6;
      t = cw.typeCode(L.slice(4, 6), t);
      t += 1.2;

      // ================= S56  class C(A,B) and super().fun() =================
      BEAT.s56 = t;
      t = cw.typeCode([L[6]], t);          // multiple inheritance: two parents
      t += 0.6;
      t = cw.typeCode([L[7]], t);
      t = cw.type(L[8], t);                // super().fun() - A's fun or B's fun?
      t += 1.8;

      // ================= S57  c_object = C() and help(c_object) =================
      BEAT.s57 = t;
      t = cw.typeCode(L.slice(9, 11), t);
      t += 0.6;

      // ================= S58  output: help() shows the MRO C, A, B, object =================
      BEAT.s58 = t;
      t = ow.pop(t);
      var HELP = ["class C(A, B)", " |  Method resolution order:", " |      C", " |      A", " |      B",
        " |      builtins.object", " |", " |  Methods defined here:", " |", " |  test(self)", " |",
        " |  " + "-".repeat(70), " |  Methods inherited from A:", " |", " |  fun(self)", " |",
        " |  " + "-".repeat(70), " |  Data descriptors inherited from A:", " |"];
      t += 0.15;
      HELP.forEach(function (s, i) { ow.print(s, "", t + i * 0.12); });
      t += HELP.length * 0.12 + 0.5;
      t += 1.6;                            // the MRO: C, then A, then B

      // ================= S59  comment help, call c_object.test(), add print('C') =================
      BEAT.s59 = t;
      var H2 = cw.edit(L[10], "# help(c_object)", t);
      t = H2.t + 1.0;
      var T1 = cw.add("c_object.test()", 13);
      t = cw.type(T1, t);
      t += 1.6;                            // c_object.test() -> super().fun() -> A first -> 'A'
      BEAT.insert = t;
      [[L[9], 12], [H2, 13], [T1, 14]].forEach(function (p) { cw.moveTo(p[0], p[1], t); });
      t += 0.7;                            // step inside test(), after super().fun()
      var PC = cw.add("        print('C')", 10);
      t = cw.type(PC, t);
      t += 1.6;

      // ================= S60  output: A then C =================
      BEAT.s60 = t;
      t = ow.clear(t);
      t = ow.print("A", "", t + 0.5);
      t = ow.print("C", "", t + 0.2);
      t += 1.0;

      // ================= S61  closing: code view holds, then everything fades out =================
      BEAT.s61 = t;
      t += 0.9;
      t = k.out([cw.el, ow.el], t, 0.6);
      window.__g10aEnd = t;
      window.__timelines["g10-a"] = tl;
    })();
  </script>
</template>
